<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>模型机</title>
<style>
:root{
  color-scheme:dark;
  --brand:#ff9426; --on-accent:#1a0f03; --brand-text:var(--brand);
  --bg:#17110a; --bg-deep:#100b06; --bg-deeper:#0a0703; --plate:#060402;
  --panel:#211a11; --sel:#2e2518;
  --text:#d8cdb9; --ink:#f8f0e0; --text-dim:#b0a48f; --faint:#74695a;
  --line:#40362a; --field:#8a7c6a;
  --ok:#8bd98f; --warn:#ecd98a; --bad:#ff7d8a; --aux:#8fb8de;
  --img-rest:grayscale(1) contrast(1.7) brightness(.62) sepia(1) saturate(3.6) hue-rotate(-11deg);
  --shot-rest:grayscale(1) sepia(.4) saturate(1.4) hue-rotate(-11deg);   }
:root[data-theme=light]{
  color-scheme:light;
  --brand-text:#ab5600;
  --accent-hover:color-mix(in srgb,var(--brand-text) 82%,#000);
  --bg:#f8f2e6; --bg-deep:#f0e8d7; --bg-deeper:#e7dec9; --plate:#15100a;
  --panel:#fffcf5; --sel:#f0e7d3;
  --text:#39322a; --ink:#17110a; --text-dim:#61584b; --faint:#928875;
  --line:#d6ccb6; --field:#8d8370;
  --ok:#1f7a3a; --warn:#7d6500; --bad:#c0233a; --aux:#2a6a9e;
}
:root{
  --brand-hover:color-mix(in srgb,var(--brand) 86%,#fff); --bar-bg:color-mix(in srgb,var(--bg) 94%,transparent);
  --accent:var(--brand-text); --accent-hover:color-mix(in srgb,var(--brand-text) 86%,#fff);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --cjk:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --sans:var(--cjk); --head:var(--cjk);
  --fs:.9375rem; --lh:1.65; --fs-sm:.8125rem; --fs-xs:.75rem;
  --s1:.875rem; --s2:1.75rem; --s3:2.625rem;
  --r:2px; --r-sm:2px;
  --t-fast:.12s; --t-med:.25s; --ease:cubic-bezier(.2,.7,.2,1);
  --t-press:.08s; --t-state:.12s; --t-budget:.4s;
  --glow:0 .5rem 1.75rem color-mix(in srgb,var(--brand) 20%,transparent);
  --ring:0 0 0 1px color-mix(in srgb,var(--brand) 45%,transparent);
  --card:var(--panel); --card-2:var(--sel); --text-2:var(--text); --t2:var(--text); --muted:var(--text-dim); --mu:var(--text-dim);
  --line-soft:var(--line); --soft:var(--line); --bt:var(--brand-text); --bh:var(--brand-hover);
  --pos:var(--ok); --neg:var(--bad);
  --thumb-bg:var(--plate); --thumb-glow:transparent; --thumb-glow-2:transparent; --thumb-halo:transparent;
  }
h1,h2,h3,h4,h5,button,input[type=button],input[type=submit],select,label,summary,time,th,nav{font-family:var(--head)}
code,pre,kbd,samp{font-family:var(--mono)}
h1,h2,h3,h4{word-break:keep-all;overflow-wrap:break-word}
:root{accent-color:var(--brand)}
.btn:active:not(:disabled),button:active:not(:disabled),[data-press]:active{filter:brightness(.88)}
button:disabled,.btn:disabled,input:disabled,select:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
[aria-busy=true]:is(button,.btn){position:relative;cursor:progress;filter:saturate(.55) brightness(.85)}
[aria-busy=true]:is(button,.btn)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,currentColor,transparent) 0 0/40% 100% no-repeat;animation:w-run 1s linear infinite}
.w-sk{display:block;position:relative;overflow:hidden;min-height:.9em;border-radius:var(--r);background:var(--sel);color:transparent!important;user-select:none}
.w-sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 9%,transparent),transparent) 0 0/50% 100% no-repeat;animation:w-run 1.2s linear infinite}
.w-sk.line{height:.9em;margin:.35em 0}.w-sk.w30{width:30%}.w-sk.w50{width:50%}.w-sk.w70{width:70%}.w-sk.w90{width:90%}.w-sk.pic{aspect-ratio:16/10}
.w-bar{display:block;height:.375rem;overflow:hidden;border-radius:var(--r);background:var(--sel)}
.w-bar>i{display:block;height:100%;width:calc(var(--p,0)*1%);background:var(--brand);transition:width var(--t-state) linear}
.w-bar.unknown>i{width:100%;background:repeating-linear-gradient(90deg,var(--brand) 0 .5rem,transparent .5rem 1rem) 0 0/2rem 100%;animation:w-slide 1s linear infinite}
.w-prog{display:grid;gap:.3rem;font-size:var(--fs-sm)}
.w-sent{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;font-size:var(--fs-sm)}
.w-sent .cells{display:flex;flex-wrap:wrap;gap:2px}
.w-sent .cells i{width:.625rem;height:.625rem;border:1px solid var(--field);border-radius:var(--r)}
.w-sent .cells i[data-s=out]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 35%,transparent)}
.w-sent .cells i[data-s=ok]{border-color:var(--ok);background:var(--ok)}
.w-sent .cells i[data-s=bad]{border-color:var(--bad);background:var(--bad)}
.w-prog .n,.w-sent .n{font-family:var(--mono);color:var(--ink)}
.w-reveal[aria-busy=true]::after{content:"";display:inline-block;width:.5em;height:1em;margin-left:.1em;vertical-align:-.15em;background:var(--brand);animation:w-blink 1s steps(2) infinite}
@keyframes w-run{from{background-position:-60% 0}to{background-position:160% 0}}
@keyframes w-slide{to{background-position:2rem 0}}
@keyframes w-blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t2);font:var(--fs)/var(--lh) var(--sans);padding:.875rem}
button{font:600 .875rem var(--head);border-radius:var(--r);padding:.5rem .875rem;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
#run{background:var(--brand);border-color:var(--brand);color:var(--on-accent)}button:disabled{opacity:.5;cursor:default}
pre{margin:.875rem 0;min-height:7em;max-height:16em;overflow:auto;background:var(--bg-deeper);border:1px solid var(--line);border-radius:var(--r);padding:.875rem;font:.8125rem/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.p{color:var(--bt)}.f{font-size:.75rem;color:var(--mu);overflow-wrap:anywhere}.f summary{cursor:pointer}#solo a{color:var(--ink)}
</style>
</head>
<body>
<p id="solo" hidden><span data-en="This page is one module of the app and has to be opened from the app.">这一页是应用里的一个模块，要从应用里打开。</span> <a href="../../index.html#machine" data-en="Open the model machine in the app">在应用里打开模型机</a></p>
<div id="main">
<p><button id="run" type="button" disabled style="display:inline-grid;text-align:center"><span style="grid-area:1/1" data-en="Write 200 characters">写 200 个字</span><span style="grid-area:1/1;visibility:hidden" aria-hidden="true" data-en="Write 200 characters">写 200 个字</span><span style="grid-area:1/1;visibility:hidden" aria-hidden="true" data-en="Write 200 more">再写 200 个</span><span style="grid-area:1/1;visibility:hidden" aria-hidden="true" data-en="Writing…">正在写…</span><span style="grid-area:1/1;visibility:hidden" aria-hidden="true" data-en="Stop">停</span></button></p>
<pre aria-live="polite"><span class="p" id="prompt"></span><span id="gen"></span></pre>
<details class="f"><summary data-en="Details: fingerprints of the model file and of what it wrote">细节：模型文件和写出内容的指纹</summary><span data-en="File">文件</span> <span id="f-file">正在读取…</span> · <span id="f-shape">—</span><br><span data-en="File sha256">文件 sha256</span> <span id="f-sha" data-reg="11c1c4b177a2308ee64732335335e044e4cf32ce0ddef75210b0d5fa4f5ed568">—</span><br><span id="f-sha-st"></span><br><span data-en="Output sha256">输出 sha256</span> <span id="f-out" data-reg="0aef22dfb94c5a76f0aa1eba5ac3f3a1852ba1982a1965a5235b696579a7acca">—</span><br><span id="f-out-st"></span> · <span id="f-speed">—</span><br><span data-en="After 200 characters the output sha256 should be 0aef22df…; the page checks it every time.">写 200 个字时，输出的 sha256 应该是 0aef22df…；页面每次都自己核对。</span></details>
<input type="file" id="file" accept=".tbw1" hidden>
</div>
<script>/* 外壳放进来的页面，页头有外壳写的 <meta name="app-lang">；没有就是被单独打开的：这一页用的文件由外壳取来核对后嵌进来，单独打开取不到，所以第一下就说明并给回应用的链接。语言：demo.js 按 <html lang> 取文案 */(function(){var m=document.querySelector('meta[name="app-lang"]'),en=m?m.content==="en":false;if(!m){try{en=localStorage.getItem("lang")==="en"}catch(e){}document.getElementById("main").hidden=true;document.getElementById("solo").hidden=false;}if(en){document.documentElement.lang="en";Array.prototype.forEach.call(document.querySelectorAll("[data-en]"),function(e){e.textContent=e.getAttribute("data-en")});}})();</script>
<template id="code"><script src="bmlp.js"></script>
<script src="demo.js" data-model="toy_bmlp.tbw1"></script></template>
<script>/* 两份脚本放在 template 里：单独打开时浏览器不去取（取也取不到）；外壳把核对过的内容嵌进来之后，这里照原样、按次序运行 */(function(){if(!document.querySelector('meta[name="app-lang"]'))return;Array.prototype.forEach.call(document.getElementById("code").content.querySelectorAll("script"),function(o){var s=document.createElement("script"),m=o.getAttribute("data-model");if(m)s.setAttribute("data-model",m);s.textContent=o.textContent;document.body.appendChild(s);});})();</script>
</body>
</html>

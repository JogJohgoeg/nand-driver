e,transparent);border-radius:var(--r);color:var(--ink);font:700 .8125rem var(--head);padding:3px .875rem;cursor:pointer}@media (max-width:480px){.mode{display:none}.lang{margin-left:auto}}.mods button[aria-current=page]{box-shadow:inset 3px 0 0 var(--brand)}:is(.card,.mods button)[data-queued]{position:relative;box-shadow:var(--ring)}:is(.card,.mods button)[data-queued]>:last-child{visibility:hidden}:is(.card,.mods button)[data-queued]::before{content:attr(data-queued);position:absolute;left:.875rem;right:.875rem;bottom:.875rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--ink)}.card[data-queued]::before{font:600 .875rem/1.6 var(--sans)}.mods button[data-queued]::before{font:.75rem/1.5 var(--head)}</style>
<title>21 NAND</title>

<meta name="description" content="21 NAND：把 AI 做成门电路放在链上。每个模块点开才下载，下载的每个文件先和链上登记的 sha256 比对，一样才运行。">

</header>

  <main class="main">
    <section class="home" id="home">
      <h1 data-en="Turn AI into logic gates, put it on chain, let anyone check it">把 AI 做成门电路，<wbr>放上链，<wbr>谁都能核对</h1>
      <p class="lead" data-en="Every module works with one tap and needs no wallet. Each file is checked against its on-chain record before it runs.">每个模块点开就能用，不用钱包。打开时自动和链上记录核对，对上了才运行。</p>
      <p class="lead" id="home-note" role="status" hidden></p>
      <div class="cards" id="home-cards"><button type="button" class="card" data-id="machine"><span class="n">01</span><strong data-en="Model machine">模型机</strong><span class="d" data-en="A toy model runs in your browser and writes one byte at a time; the text is not fluent and not a story. Its files are checked against the chain first and only run if they match.">一个玩具模型在浏览器里一个字节一个字节往外写，写出来还不通顺，不是故事。打开时自动核对，和链上记录对上了才运行。</span><span class="st"><b data-en="200 chars">200 字</b><span data-en="identical to the reference output, byte for byte, every time">每次写出的都和标准答案逐字节一致</span></span><span class="go2" data-en="Open →">打开 →</span></button><button type="button" class="card" data-id="squared"><span class="n">02</span><strong data-en="NAND plays Squared">NAND 玩 Squared</strong><span class="d" data-en="A circuit on chain plays an 11×11 game by itself. Only &quot;Run one step on chain&quot; goes online, asking the blockchain to compute the same move.">链上的一块电路自己玩 11×11 小游戏。点「链上跑一步」才会联网，让区块链用同一个局面再算一次。</span><span class="st"><b>178 / 178</b><span data-en="the chain and your browser computed exactly the same moves">链上算的和你浏览器里算的完全一样</span></span><span class="go2" data-en="Open →">打开 →</span></button><button type="button" class="card" data-id="brain"><span class="n">03</span><strong data-en="Gate brain">门电路大脑</strong><span class="d" data-en="Ask a small AI questions on your own computer, one at a time; its answers match this model&#x27;s integer reference implementation word for word and your questions never leave your machine. Use a recent desktop Chrome or Edge (WebGPU); the first download is about 580 MB and is not repeated; the browser needs about 6 GB of memory; phones can&#x27;t run it. That is why it opens in a new tab.">在你自己的电脑上向一个小 AI 提问，一问一答，回答和这个模型的整数参考实现一字不差，问题不离开你的电脑。用电脑上新版 Chrome 或 Edge（要 WebGPU）；第一次下载约 580 MB，以后不用再下；浏览器要占约 6 GB 内存；手机打不开。所以在新页面打开。</span><span class="st"><b>3 / 3</b><span data-en="reference questions answered word for word like the integer reference implementation">标准题的回答和整数参考实现逐字一致</span></span><span class="go2" data-en="Open the gate brain →">打开门电路大脑 →</span></button><button type="button" class="card" data-id="arena"><span class="n">04</span><strong data-en="Driving arena">开车竞技场</strong><span class="d" data-en="A car driven by just 21 gates laps a winding track by itself. Tap &quot;Drive a lap&quot;; to double-check, ask the blockchain to compute a step too.">一辆只靠 21 个门开车的小车，在弯道上自己绕圈。点「开一圈」就开；想确认，可以让区块链也算一步。</span><span class="st"><b>24 / 24</b><span data-en="every fixed start finishes a full lap">固定起点全部跑完一圈</span></span><span class="go2" data-en="Open →">打开 →</span></button><button type="button" class="card" data-id="verify"><span class="n">05</span><strong data-en="Check it yourself">自己核对</strong><span class="d" data-en="Pick any file on this site and compare it with its on-chain record to confirm it has not been altered.">挑本站任何一个文件，和链上记录比一比，确认它没被改过。</span><span class="st"><b>217 / 217</b><span data-en="every file on this site is recorded on chain and downloads byte for byte">本站文件都登记在链上，下载下来逐字节一致</span></span><span class="go2" data-en="Open →">打开 →</span></button><button type="button" class="card" data-id="build"><span class="n">06</span><strong data-en="Build a circuit">做电路</strong><span class="d" data-en="Make a small circuit, test every input in your browser, then write it on chain with your wallet. This is the only step that needs a wallet, so it comes last.">做一个小电路，先在浏览器里把所有输入都试一遍，再用你的钱包写上链。只有这一步要用钱包，所以放在最后。</span><span class="st"><b data-en="3,829 gates">3,829 门</b><span data-en="a computing circuit we put on chain; anyone can look it up">我们放上链的一个计算电路，谁都能查到</span></span><span class="go2" data-en="Start building →">开始做电路 →</span></button></div>
    </section>
    <h1 id="m-title" hidden></h1>
    <p class="lead" id="m-desc" hidden></p>
    <details class="chk" id="m-chk" hidden><summary id="m-sum" aria-live="polite"></summary><ul class="log" id="m-log"></ul></details>
    <div class="stop" id="m-stop" role="alert" hidden><p id="m-stop-t"></p><button type="button" id="m-retry" data-en="Retry">重试</button></div>
    <p><a class="go" id="m-link" hidden></a></p>
    <section class="tool" id="m-tool" hidden>
      <form id="v-form">
        <label for="v-path" data-en="Path of any file on this site">本站的文件路径</label>
        <div class="row"><input id="v-path" value="index.html" spellcheck="false" autocomplete="off"><button type="submit" data-en="Check">核对</button></div>
      </form>
      <p class="res" id="v-res" aria-live="polite"></p>
      <details class="more"><summary data-en="Details">看细节</summary><pre id="v-out"></pre>
      <p class="hint" data-en="Reads this file's record on BNB Chain (at least two public nodes must agree), downloads the same file from this site and computes its fingerprint (sha256) yourself. Read-only, no wallet.">从 BNB Chain 读这个文件的链上记录（至少两家公共节点说法一致才算数），再从本站下载同一个文件自己算指纹（sha256）。只读，不用钱包。</p></details>
    </section>
    <iframe class="frame" id="m-frame" title="模块" sandbox="allow-scripts allow-downloads" hidden></iframe>
  </main>
</div>
<p class="w-live" id="home-wait" role="status" aria-live="polite" style="position:fixed;left:0;top:0;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap"></p>
<script>
/* 模块清单还在和链上核对的那一两秒里，按钮已经能点：点了当场回应，并记住最后一次点的是哪个模块；核对通过后由 loader.js 打开它。
   这一段不取任何文件、不拼模块、不碰沙箱框架，只记一个名字。写在网页里是为了第一下回应不等任何别的文件。 */
(function () {
  var W = window.__appWait = { id: null, zh: null, title: null, el: null, done: false }, en;
  try { en = localStorage.getItem("lang"); } catch (e) {}
  en = en === "en" || (en !== "zh" && !/^zh/i.test(navigator.language || "zh"));
  var live = document.getElementById("home-wait"), boxes = [document.getElementById("mods"), document.getElementById("home-cards")];
  W.clear = function () { if (W.el) { W.el.removeAttribute("aria-busy"); W.el.removeAttribute("data-queued"); } W.el = null; live.textContent = ""; };
  boxes.forEach(function (box) {
    Array.prototype.forEach.call(box.querySelectorAll("button[disabled]"), function (b) { b.disabled = false; });   // 占位按钮不禁用：禁用的按钮点了没有任何回应
    box.addEventListener("click", function (ev) {
      var b = ev.target.closest ? ev.target.closest("button") : null; if (!b || W.done || !box.contains(b)) return;
      var st = b.querySelector("strong"); if (!st) return;
      W.clear();                                           // 只记最后一次：又点了别的，前一个恢复原样
      W.el = b; W.id = b.getAttribute("data-id"); W.zh = st.dataset.zh || st.textContent; W.title = (en && st.getAttribute("data-en")) || st.textContent;
      b.setAttribute("aria-busy", "true"); b.setAttribute("data-queued", en ? "Checking, opens when done" : "正在核对，核完就打开");
      live.textContent = en ? "Checking the module list against the chain. \u201c" + W.title + "\u201d will open as soon as the check passes." : "正在和链上核对模块清单，核完就打开「" + W.title + "」。";
    });
  });
})();
</script>

rcuits and chain addresses","camera":"Camera","cameraHelp":"Follow view keeps your orbit and zoom while tracking the duck. Double-click the scene or use Reset camera to restore the default view.","compositeChoice":"Composite · #281 → #282","compositeOne":"Composite · one-clear (local)","course":"Whole course","course1":"Original · 8 starts","course2":"Course 2 · U pocket and gap · 16 starts","courseCarry":"Changing course keeps the brain and seed. A fixed start unavailable on the new course falls back to start 1.","courseSelect":"Course","credits":"Credits and licenses","depth":"Virtual depth 8×8","depthInspect":"Tap / arrow keys: sample a cell","depthLegend":"Red \u003c0.3 m · hatched amber 0.3≤distance\u003c0.7 m · dark green ≥0.7 m. ≥2 m means capped range or no ray hit. Hover for distance; tapping saves a step-stamped sample.","evaluation":"Full evaluation and random-start results","expert":"Expert","explanation":"Upstream ONNX walks locally. Burned #281 steers: 39 NAND gates, TapeOut encoding as #279/#280. #282 adds turn memory. Original course: 7/8 goals · 6/8 collision-free.","exportTrial":"Pause and export trial","fixedSummaryJson":"Fixed summary (JSON)","follow":"Follow duck","footnote":"Cyan borders mark each circuit’s two output bits. Depth: each row has L/C/R near (\u003c0.3 m), far (\u003c0.7 m). Goal bits: left/right beyond ±0.15 rad. Outputs [left,right]: 10 left, 01 right, 00/11 straight. Forward command stays 0.25 m/s. On-chain eval is read-only; RPC delays slow playback. Failures continue locally with retry backoff; pause or switch off to cancel a pending read. Interactive playback pauses when the page is hidden; press Run to resume. Batch tests may continue. Composite state belongs to this trial and is passed to step; the contract’s callerState is never written.","inputMapping":"14-bit input map","inputNote":"3×2×2 depth + 2 goal","inputs":"14 input bits · index:value","loading":"1/3 Loading local robot, MuJoCo and walking policy…","mapCondition":

<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>门电路大脑 · BitCPM4-1B</title>
<meta name="description" content="一个被拆成几千亿个电子开关的小型 AI，在你电脑的显卡上逐个开关地算出回答，与原版模型一字不差；准备好之后断网也能用。">
<meta name="theme-color" content="#050506">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235741D8'/%3E%3Cpath d='M8 9h8a7 7 0 0 1 0 14H8z' fill='none' stroke='%23FFFFFF' stroke-width='2.4'/%3E%3Ccircle cx='24.5' cy='16' r='2.2' fill='none' stroke='%23FFFFFF' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* 门电路大脑 · Kraken Pro 式深色（2026-10-14 起，配色基准 hashport/site/home.css；取代 10-01 的绿色版式）。
   只有一套深色，不再跟随系统浅色/深色；字体用系统字体，不连外部字体。
   脚本依赖的 id 与类名（mute ok warn bad tool note row label pill on off msg you bot who txt meta acts sel idea errcard primary danger btn mono think dots）不变；
   脚本会整体改写 #verdict #st #startNote #stHint #clearRow #pill 的 class，所以这些只用 id 选择器补样式。
   脚本内联样式里用到的 --accent-line / --accent-bg（测速结果卡）保留为别名。 */
:root{color-scheme:dark;
  --bg:#050506;--panel:#111114;--panel2:#17171C;--ink:#FFFFFF;--ink2:#CBCBD3;--ink3:#9C9DAE;
  --line:rgba(112,113,135,.14);--line2:rgba(112,113,135,.24);
  --brand:#5741D8;--brand-hover:#6A55E8;--hi:#A496FF;--hi-soft:rgba(87,65,216,.16);--on-hi:#FFFFFF;
  --pos:#00DA80;--warn:#F5A524;--err:#F0616D;--err-soft:rgba(240,97,109,.08);
  --glow:radial-gradient(70% 90% at 25% 0%,rgba(87,65,216,.28),rgba(87,65,216,0) 70%);
  --accent-bg:var(--hi-soft);--accent-line:var(--hi);
  --sans:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --in:960px;--gut:clamp(16px,4vw,40px);--head:72px}
/* 原「绿带」（页头、首屏）：改成深底，首屏顶部一层淡紫色光 */
.g{background:var(--bg);color:var(--ink)}
.hero.g{background:var(--glow),var(--bg)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--head) + 16px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.62 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--hi);text-decoration:underline;text-decoration-color:rgba(164,150,255,.4);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:#C2B9FF;text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.mono{font-family:var(--mono)}
.mute{color:var(--ink3)}.ok{color:var(--pos)}.bad{color:var(--err)}.warn{color:var(--warn)}.tool{color:var(--hi)}
.wrap{max-width:var(--in);margin:0 auto;padding:0 var(--gut)}

/* 按钮：圆角；次按钮深灰底 + 细边框，主按钮品牌紫底白字 */
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;
  font:600 15px/1.1 var(--sans);white-space:nowrap;
  color:var(--ink);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;cursor:pointer;text-decoration:none}
button:hover:not(:disabled),.btn:hover{border-color:rgba(112,113,135,.5);color:var(--ink);background:#1F1F26}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.primary:hover:not(:disabled){background:var(--brand-hover);border-color:var(--brand-hover);color:#fff}
button.danger{border-color:rgba(240,97,109,.5);color:var(--err)}
button.danger:hover:not(:disabled){border-color:var(--err);color:var(--err);background:var(--err-soft)}
button.icon{min-width:40px;padding:0 8px;font:400 18px/1 var(--sans)}

/* ---- 页头：深底 + 字标（回主站首页），右侧是本页原有的控件 ---- */
.bar{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:var(--head);padding-top:7px;padding-bottom:7px}
.mark{display:grid;margin-right:auto;line-height:1.05;color:var(--ink);text-decoration:none}
.mark b{font:800 19px/1.05 var(--sans);letter-spacing:.01em}
.mark small{margin-top:5px;font:400 10px/1 var(--mono);letter-spacing:.08em;white-space:nowrap;color:var(--ink3)}
.rate{padding:8px 10px;font:500 12px/1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--pos);border:1px solid rgba(0,218,128,.4);border-radius:8px}
.tools{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;align-items:center;margin-left:auto}
.bar button,.bar .btn{background:var(--panel2);border-color:var(--line2);color:var(--ink2)}
.bar button:hover:not(:disabled),.bar .btn:hover{background:#1F1F26;border-color:rgba(112,113,135,.5);color:var(--ink)}
.bar #lang{min-width:44px;padding:0 10px;font:500 12px/1 var(--mono);letter-spacing:.06em;background:transparent;border-color:var(--line2)}

/* ---- 首屏：状态、大标题、说明、四个数 ---- */
.hero{padding:clamp(28px,5vw,60px) 0 clamp(30px,4.5vw,52px)}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:0 0 16px}
.sub{font:400 12px/1.5 var(--mono);letter-spacing:.02em;color:var(--ink3)}
html[lang="en"] .sub{letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;font:500 11.5px/1.25 var(--mono);letter-spacing:.02em;color:var(--ink2);border:1px solid var(--line2);border-radius:999px;background:var(--panel)}
.pill i{width:7px;height:7px;flex:none;border-radius:50%;background:currentColor}
.pill.on{color:var(--pos);border-color:rgba(0,218,128,.4)}
.pill.off{color:var(--err);background:var(--err-soft);border-color:rgba(240,97,109,.4)}
h1{margin:0;font:800 clamp(38px,6vw,64px)/1.1 var(--sans);letter-spacing:-.01em;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.lead{margin:24px 0 0;max-width:44em;font-size:17px;line-height:1.7;color:var(--ink2)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:clamp(26px,4vw,42px) 0 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.facts div{min-width:0;padding:16px 16px 18px 0}
.facts div+div{padding-left:18px;border-left:1px solid var(--line)}
.facts b{display:block;font:800 clamp(24px,2.8vw,34px)/1.15 var(--sans);font-variant-numeric:tabular-nums;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.facts span{display:block;margin-top:8px;font-size:13px;line-height:1.5;color:var(--ink3)}

/* ---- 主体：卡片（准备、设置）与说明区（实测、证据） ---- */
main>.wrap{padding-top:clamp(24px,4vw,44px);padding-bottom:28px}
.card{margin:0 0 20px;padding:clamp(18px,2.6vw,26px);background:var(--panel);border:1px solid var(--line2);border-radius:16px}
.label{display:block;margin:0 0 6px;font:600 12px/1.4 var(--mono);letter-spacing:.04em;color:var(--hi)}
html[lang="en"] .label{letter-spacing:.08em;text-transform:uppercase}
.card>h2,#secBoard>h2,#secProof>h2{margin:0 0 10px;font:700 clamp(22px,2.6vw,28px)/1.25 var(--sans);color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
#secSettings>h2~h2{padding-top:16px;margin-bottom:4px;font-size:19px;font-weight:700;color:var(--ink);border-top:1px solid var(--line)}
#secBoard,#secProof{margin:clamp(44px,6vw,72px) 0 0;padding:0;background:none;border:0;border-radius:0}
#secBoard>h2,#secProof>h2{margin-bottom:16px;font-size:clamp(26px,3.4vw,34px);font-weight:800}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.note{margin:10px 0 0;font-size:14px;line-height:1.65;color:var(--ink2)}
#verdict{margin:6px 0 0;font-size:16.5px;font-weight:500}
#start{min-height:48px;padding:0 26px;font-size:18px;border-radius:12px}
#st{margin-top:10px;font-size:15px}
#st:empty,#startNote:empty,#stHint:empty{display:none}
.bar2{height:6px;margin-top:12px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar2 i{display:block;width:0;height:100%;background:var(--brand);transition:width .3s}
#proof ul{list-style:square;color:var(--ink2)}
#proof li{margin:0 0 10px;line-height:1.65}
#proof li::marker{color:var(--hi)}
#proof b{color:var(--ink)}

/* 表格：表头等宽小号、底部细线；行间淡线；数字等宽 */
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:9px 14px 9px 0;vertical-align:top;text-align:left}
th{font:500 11px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;color:var(--ink3);border-bottom:1px solid var(--line2)}
html[lang="en"] th{letter-spacing:.08em}
tr+tr td{border-top:1px solid var(--line)}
td.mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}

/* 折叠项：上下细线，右侧「+」，展开时转 45° */
details{margin-top:14px;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
details>summary{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:44px;padding:8px 0;list-style:none;cursor:pointer;
  font:600 16px/1.35 var(--sans);color:var(--hi)}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";flex:none;font:300 24px/1 var(--sans);color:var(--ink3);transition:transform .2s}
details[open]>summary::after{transform:rotate(45deg)}
details[open]{padding-bottom:12px}
details.foot{margin:clamp(44px,6vw,72px) 0 0;padding:0 clamp(18px,2.6vw,26px);background:var(--panel);border:1px solid var(--line2);border-radius:16px}
details.foot>summary{padding:18px 0;font-size:clamp(19px,2.2vw,24px);font-weight:700;color:var(--ink)}
details.foot>summary::after{font-size:30px}
details.foot[open]{padding-bottom:18px}
.foot p{max-width:62em;margin:0 0 12px;font-size:15px;color:var(--ink2)}

/* 出错卡（测速结果卡借用它，内联样式把边线、底色换成紫） */
.errcard{margin-top:10px;padding:12px 14px;background:var(--err-soft);border:1px solid var(--err);border-left-width:4px;border-radius:10px}
.errcard>b{font-size:16px}
textarea.code{width:100%;padding:10px;font:13px/1.5 var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:10px;resize:vertical}
pre{margin:8px 0 0;padding:10px 12px;font:12.5px/1.5 var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:10px;overflow:auto;white-space:pre-wrap}

/* ---- 对话 ---- */
#secChat{margin-top:clamp(28px,4vw,44px)}
.ideas{display:flex;gap:10px;margin:0;padding:2px 2px 10px;overflow-x:auto;scroll-snap-type:x mandatory}
.idea{flex:0 0 232px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:0;min-height:96px;padding:12px 14px;
  scroll-snap-align:start;text-align:left;white-space:normal;color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:14px;
  font:400 14.5px/1.5 var(--sans)}
.idea:hover:not(:disabled){color:var(--ink);background:var(--panel2);border-color:rgba(164,150,255,.5)}
.idea .label{margin-bottom:8px}
#log{display:flex;flex-direction:column;gap:14px;margin:16px 0}
.msg{max-width:min(92%,780px);padding:12px 14px;border:1px solid var(--line2);border-radius:14px}
.msg .who{margin-bottom:6px}
.msg.you{align-self:flex-end;background:var(--hi-soft);border-color:rgba(164,150,255,.35)}
.msg.bot{align-self:flex-start;background:var(--panel)}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.think{color:var(--ink3)}
.dots::after{content:'';animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.meta{margin-top:10px;padding-top:8px;font:12px/1.55 var(--mono);color:var(--ink3);border-top:1px solid var(--line)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts button{min-height:32px;padding:0 10px;font-size:13.5px;border-radius:8px}
.acts button.sel{color:var(--hi);background:var(--hi-soft);border-color:var(--hi)}

/* ---- 输入栏（贴在底部；实底，不用毛玻璃） ---- */
.composer{position:sticky;bottom:0;z-index:15;padding:12px 0 14px;background:var(--bg);border-top:1px solid var(--line2)}
.composer .box{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;min-height:46px;max-height:160px;padding:10px 12px;font:16px/1.5 var(--sans);
  color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:12px;resize:none}
.composer textarea::placeholder{color:var(--ink3);opacity:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.composer textarea:focus{outline:2px solid var(--hi);outline-offset:1px;border-color:var(--hi)}
.composer button{min-height:46px;border-radius:12px}
.composer .hint{font-size:12.5px;color:var(--ink3)}

@media (max-width:760px){
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts div:nth-child(3){padding-left:0;border-left:0}
  .facts div:nth-child(-n+2){border-bottom:1px solid var(--line)}
}
@media (max-width:640px){
  body{font-size:15px}
  .hide-s,.sub{display:none}
  .hero{padding:24px 0 28px}
  .eyebrow{margin-bottom:12px}
  .lead{margin-top:18px;font-size:15.5px;line-height:1.65}
  .facts{margin-top:22px}
  .facts div{padding:12px 12px 14px 0}
  .facts div+div{padding-left:12px}
  .facts b{font-size:24px}
  .facts span{margin-top:6px;font-size:12.5px}
  /* 表格在卡内横向滚动：第一列留够宽度，表头可以折行 */
  #board table,#telemetry table{min-width:560px}
  #board th,#telemetry th{white-space:normal}
  #board td:first-child{min-width:170px}
  #telemetry td:nth-child(2){min-width:140px}
}
/* 触屏：可点区域至少 44px */
@media (pointer:coarse),(max-width:600px){
  button,.btn{min-height:44px;touch-action:manipulation}
  button.icon,.bar #lang{min-width:44px}
  .acts button{min-height:44px}
}
/* 窄屏生成中（速度标签出现）时收起字标下的小字，免得页头挤成两行 */
@media (max-width:480px){.bar:has(#rate:not([hidden])) .mark small{display:none}}
@media (prefers-reduced-motion:reduce){details>summary::after,.bar2 i{transition:none}.dots::after{animation:none;content:'...'}}
</style><!--tk-shell--><script src="../shell/lang.js"></script><link rel="stylesheet" href="../shell/shell.css"><script src="../shell/shell.js" defer></script><!--/tk-shell-->
</head>
<body>
<header class="bar g"><div class="wrap">
  <a class="mark" href="../" aria-label="21 NAND Driver"><b>21 NAND<br>Driver</b><small>TapeOut · BNB Chain</small></a>
  <div class="tools">
    <span id="rate" class="rate" hidden></span>
    <button id="newChat" class="icon" type="button" data-tip="newChat" hidden>＋</button>
    <button id="gear" class="icon" type="button" data-tip="settings">⚙</button>
    <button id="lang" type="button">EN</button>
    <a class="btn hide-s" href="../xlayer-bench/" data-t="back">← 工作台</a>
  </div>
</div></header>

<main>
<section class="hero g" aria-labelledby="pageTitle"><div class="wrap">
  <div class="eyebrow"><span id="pill" class="pill"><i></i><span id="pillT"></span></span><span class="sub mono" id="sub"></span></div>
  <h1 id="pageTitle" data-t="title">门电路大脑</h1>
  <p class="lead" data-t="lead"></p>
  <div class="facts">
    <div><b data-t="f1v"></b><span data-t="f1"></span></div>
    <div><b data-t="f2v"></b><span data-t="f2"></span></div>
    <div><b id="fC">128</b><span data-t="f3"></span></div>
    <div><b data-t="f4v"></b><span data-t="f4"></span></div>
  </div>
</div></section>

<div class="wrap">
  <section class="card" id="secPrep">
    <span class="label" data-t="stepLabel"></span>
    <h2 data-t="s_dev"></h2>
    <div id="verdict"></div>
    <div class="row" style="margin-top:6px"><button id="start" class="primary" hidden data-t="start"></button></div>
    <p id="startNote" class="note"></p>
    <div id="st" class="mute"></div>
    <div class="bar2" id="barBox" hidden><i id="bar"></i></div>
    <p id="stHint" class="note"></p>
    <div id="errBox"></div>
    <details id="preBox" style="margin-top:8px"><summary data-t="pre_sum"></summary><div id="pre" style="margin-top:8px"></div></details>
  </section>


  <section class="card" id="secSettings" hidden>
    <span class="label" data-t="setLabel"></span>
    <h2 data-t="s_set"></h2>

    <h2 style="margin-top:14px" data-t="st_data"></h2>
    <div id="dataInfo" class="note" style="margin-top:0"></div>
    <div class="row" id="clearRow"><button id="clear" type="button" class="danger" data-t="clear"></button></div>

    <h2 style="margin-top:18px" data-t="st_bench"></h2>
    <p class="note" style="margin-top:0" data-t="bench_help"></p>
    <div class="row"><button id="bench" type="button" disabled data-t="bench_go"></button></div>
    <div id="benchOut"></div>

    <h2 style="margin-top:18px" data-t="st_log"></h2>
    <p class="note" style="margin-top:0" data-t="log_help"></p>
    <div class="scroll" id="telemetry"></div>
    <div class="row"><button id="telClear" type="button" data-t="tel_clear"></button></div>

    <h2 style="margin-top:18px" data-t="st_long"></h2>
    <p class="note" style="margin-top:0" data-t="long_help"></p>
    <div class="row"><button id="long" type="button" data-t="long"></button></div>

    <details style="margin-top:16px"><summary data-t="tools_sum"></summary>
      <p class="note" data-t="tools_help"></p>
      <textarea id="tools" class="code" rows="6" style="margin-top:6px"></textarea>
      <div class="row"><button id="toolEx" type="button" data-t="tool_ex"></button></div>
    </details>
  </section>

  <section class="card" id="secBoard">
    <span class="label" data-t="boardLabel"></span>
    <h2 data-t="s_board"></h2>
    <div class="scroll" id="board"></div>
    <p class="note" data-t="board_help"></p>
  </section>

  <section class="card" id="secProof">
    <span class="label" data-t="proofLabel"></span>
    <h2 data-t="s_proof"></h2>
    <div id="proof"></div>
  </section>

  <details class="card foot"><summary data-t="s_how"></summary>
    <p data-t="h1"></p><p data-t="h2"></p><p data-t="h3"></p><p data-t="h4"></p>
    <p><a href="./PROVENANCE.json" data-t="l_prov"></a> · <a href="./LICENSES/NOTICE">NOTICE</a> · <a href="./LICENSES/Apache-2.0.txt">Apache-2.0</a> · <a href="./LICENSES/BitCPM4-1B-README.md" data-t="model_card"></a> · <a href="./demo.html" data-t="plain"></a></p>
  </details>
  <section id="secChat">
    <div id="ideas" class="ideas"></div>
    <div id="log"></div>
  </section>
</div>
</main>

<form class="composer" id="composer"><div class="wrap">
  <div class="box">
    <textarea id="msg" rows="1"></textarea>
    <button id="go" class="primary" type="submit" disabled data-t="go"></button>
    <button id="stop" type="button" disabled data-t="stop" hidden></button>
  </div>
  <div class="row" style="margin-top:6px"><button id="cont" type="button" hidden data-t="cont"></button><span id="cHint" class="hint" style="margin:0"></span></div>
</div></form>

<script type="module" src="./page.mjs"></script>
</body></html>

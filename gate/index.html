<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>门电路大脑 · BitCPM4-1B</title>
<meta name="description" content="一个被拆成几千亿个电子开关的小型 AI，在你电脑的显卡上逐个开关地算出回答，与原版模型一字不差；准备好之后断网也能用。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1512'/%3E%3Cpath d='M8 9h8a7 7 0 0 1 0 14H8z' fill='none' stroke='%2339d98a' stroke-width='2.4'/%3E%3Ccircle cx='24.5' cy='16' r='2.2' fill='none' stroke='%2339d98a' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--bg:#f4f8f6;--panel:#fff;--panel2:#eaf3ee;--line:#cfe0d7;--line2:#9fbcae;--text:#13231c;--muted:#587066;--accent:#0c8a52;--accent-bg:rgba(12,138,82,.09);--accent-line:rgba(12,138,82,.45);--on-accent:#fff;--ok:#0c8a52;--bad:#b3261e;--warn:#8a5a00;--tool:#0b57d0;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1512;--panel:#0f1d18;--panel2:#132720;--line:#1d372e;--line2:#2d5646;--text:#e2eee8;--muted:#8ea79c;--accent:#39d98a;--accent-bg:rgba(57,217,138,.1);--accent-line:rgba(57,217,138,.5);--on-accent:#06120d;--ok:#39d98a;--bad:#ff8a80;--warn:#e7b964;--tool:#8ab4f8}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1512;--panel:#0f1d18;--panel2:#132720;--line:#1d372e;--line2:#2d5646;--text:#e2eee8;--muted:#8ea79c;--accent:#39d98a;--accent-bg:rgba(57,217,138,.1);--accent-line:rgba(57,217,138,.5);--on-accent:#06120d;--ok:#39d98a;--bad:#ff8a80;--warn:#e7b964;--tool:#8ab4f8}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--accent)}
.mono{font-family:var(--mono)}
.mute{color:var(--muted)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.tool{color:var(--tool)}
button,.btn{font:inherit;font-size:14px;padding:5px 12px;border:1px solid var(--line2);background:var(--panel);color:var(--text);border-radius:8px;cursor:pointer;text-decoration:none;white-space:nowrap}
button:hover:not(:disabled),.btn:hover{border-color:var(--accent-line);background:var(--accent-bg)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
button.icon{padding:5px 9px}
button.danger{border-color:var(--bad);color:var(--bad)}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
/* 顶栏 */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.logo{width:34px;height:34px;flex:none;border-radius:9px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center}
.title{min-width:0;flex:1}
.title b{font-size:16px}
.sub{font-size:11.5px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);vertical-align:2px;margin-left:6px}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.on{color:var(--accent);border-color:var(--accent-line);background:var(--accent-bg)}
.pill.off{color:var(--warn);border-color:var(--warn)}
.rate{font:600 12px/1 var(--mono);color:var(--accent);border:1px solid var(--accent-line);background:var(--accent-bg);border-radius:999px;padding:5px 9px}
.tools{display:flex;gap:6px;align-items:center}
/* 卡片 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:16px 0}
.card h2{font-size:14px;margin:0 0 8px;font-weight:600}
.label{font:600 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lead{margin:14px 0 0;color:var(--text)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 0}
.facts div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.facts b{display:block;font:600 15px/1.3 var(--mono)}
.facts span{font-size:12px;color:var(--muted)}
.bar2{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:8px}
.bar2 i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
table{border-collapse:collapse;font-size:13px;width:100%}
td,th{padding:5px 8px 5px 0;vertical-align:top;text-align:left}
th{font-weight:600;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
tr+tr td{border-top:1px solid var(--line)}
.scroll{overflow-x:auto}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
/* 出错卡 */
.errcard{border:1px solid var(--bad);border-radius:10px;padding:10px 12px;margin-top:8px;background:color-mix(in srgb,var(--bad) 7%,transparent)}
/* 对话 */
#log{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.msg{max-width:92%;border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.msg .who{margin-bottom:4px}
.msg.you{align-self:flex-end;background:var(--accent-bg);border-color:var(--accent-line)}
.msg.bot{align-self:flex-start;background:var(--panel)}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.think{color:var(--muted)}
.dots::after{content:'';animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.meta{font:12px/1.5 var(--mono);color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.acts{display:flex;gap:6px;margin-top:6px}
.acts button{font-size:12px;padding:2px 8px}
.acts button.sel{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.ideas{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:12px 0 0}
.idea{display:flex;flex-direction:column;justify-content:flex-start;flex:0 0 220px;scroll-snap-align:start;text-align:left;white-space:normal;border-radius:12px;padding:10px 12px;background:var(--panel)}
.idea .label{display:block;margin-bottom:6px}
/* 输入 */
.composer{position:sticky;bottom:0;z-index:4;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 0 12px}
.composer .box{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:44px;max-height:160px;font-size:15px;line-height:1.5;font-family:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line2);padding:9px 11px;border-radius:12px;resize:none}
.composer textarea:focus{outline:none;border-color:var(--accent)}
.composer .hint{font-size:12px;color:var(--muted);margin-top:6px}
textarea.code{width:100%;font:13px/1.5 var(--mono);background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:8px;border-radius:8px;resize:vertical}
pre{font:12px/1.5 var(--mono);background:var(--panel2);padding:8px;border-radius:8px;overflow:auto;white-space:pre-wrap}
.foot p{font-size:13.5px;color:var(--muted);margin:8px 0}
@media (max-width:640px){.wrap{padding:0 14px}.facts{grid-template-columns:repeat(2,1fr)}.sub{display:none}.hide-s{display:none}}
</style></head>
<body>
<header class="bar"><div class="wrap">
  <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 32 32"><path d="M6 8h9a8 8 0 0 1 0 16H6z" fill="none" stroke="var(--accent)" stroke-width="2.6"/><circle cx="26" cy="16" r="2.6" fill="none" stroke="var(--accent)" stroke-width="2.2"/></svg></div>
  <div class="title"><b data-t="title">门电路大脑</b><span id="pill" class="pill"><i></i><span id="pillT"></span></span>
    <div class="sub mono" id="sub"></div></div>
  <span id="rate" class="rate" hidden></span>
  <div class="tools">
    <button id="newChat" class="icon" type="button" data-tip="newChat" hidden>＋</button>
    <button id="gear" class="icon" type="button" data-tip="settings">⚙</button>
    <button id="lang" type="button">EN</button>
    <a class="btn hide-s" href="../xlayer-bench/" data-t="back">← 工作台</a>
  </div>
</div></header>

<main class="wrap">
  <p class="lead" data-t="lead"></p>
  <div class="facts">
    <div><b data-t="f1v"></b><span data-t="f1"></span></div>
    <div><b data-t="f2v"></b><span data-t="f2"></span></div>
    <div><b id="fC">128</b><span data-t="f3"></span></div>
    <div><b data-t="f4v"></b><span data-t="f4"></span></div>
  </div>

  <section class="card" id="secPrep">
    <span class="label" data-t="stepLabel"></span>
    <h2 data-t="s_dev"></h2>
    <div id="verdict"></div>
    <div class="row" style="margin-top:6px"><button id="start" class="primary" hidden data-t="start"></button></div>
    <p id="startNote" class="note"></p>
    <div id="st" class="mute"></div>
    <div class="bar2" id="barBox" hidden><i id="bar"></i></div>
    <p id="stHint" class="note"></p>
    <div id="errBox"></div>
    <details id="preBox" style="margin-top:8px"><summary data-t="pre_sum"></summary><div id="pre" style="margin-top:8px"></div></details>
  </section>


  <section class="card" id="secSettings" hidden>
    <span class="label" data-t="setLabel"></span>
    <h2 data-t="s_set"></h2>

    <h2 style="margin-top:14px" data-t="st_data"></h2>
    <div id="dataInfo" class="note" style="margin-top:0"></div>
    <div class="row" id="clearRow"><button id="clear" type="button" class="danger" data-t="clear"></button></div>

    <h2 style="margin-top:18px" data-t="st_bench"></h2>
    <p class="note" style="margin-top:0" data-t="bench_help"></p>
    <div class="row"><button id="bench" type="button" disabled data-t="bench_go"></button></div>
    <div id="benchOut"></div>

    <h2 style="margin-top:18px" data-t="st_log"></h2>
    <p class="note" style="margin-top:0" data-t="log_help"></p>
    <div class="scroll" id="telemetry"></div>
    <div class="row"><button id="telClear" type="button" data-t="tel_clear"></button></div>

    <h2 style="margin-top:18px" data-t="st_long"></h2>
    <p class="note" style="margin-top:0" data-t="long_help"></p>
    <div class="row"><button id="long" type="button" data-t="long"></button></div>

    <details style="margin-top:16px"><summary data-t="tools_sum"></summary>
      <p class="note" data-t="tools_help"></p>
      <textarea id="tools" class="code" rows="6" style="margin-top:6px"></textarea>
      <div class="row"><button id="toolEx" type="button" data-t="tool_ex"></button></div>
    </details>
  </section>

  <section class="card" id="secBoard">
    <span class="label" data-t="boardLabel"></span>
    <h2 data-t="s_board"></h2>
    <div class="scroll" id="board"></div>
    <p class="note" data-t="board_help"></p>
  </section>

  <section class="card" id="secProof">
    <span class="label" data-t="proofLabel"></span>
    <h2 data-t="s_proof"></h2>
    <div id="proof"></div>
  </section>

  <details class="card foot"><summary data-t="s_how"></summary>
    <p data-t="h1"></p><p data-t="h2"></p><p data-t="h3"></p><p data-t="h4"></p>
    <p><a href="./PROVENANCE.json" data-t="l_prov"></a> · <a href="./LICENSES/NOTICE">NOTICE</a> · <a href="./LICENSES/Apache-2.0.txt">Apache-2.0</a> · <a href="./LICENSES/BitCPM4-1B-README.md" data-t="model_card"></a> · <a href="./demo.html" data-t="plain"></a></p>
  </details>
  <section id="secChat">
    <div id="ideas" class="ideas"></div>
    <div id="log"></div>
  </section>
</main>

<form class="composer" id="composer"><div class="wrap">
  <div class="box">
    <textarea id="msg" rows="1"></textarea>
    <button id="go" class="primary" type="submit" disabled data-t="go"></button>
    <button id="stop" type="button" disabled data-t="stop" hidden></button>
  </div>
  <div class="row" style="margin-top:6px"><button id="cont" type="button" hidden data-t="cont"></button><span id="cHint" class="hint" style="margin:0"></span></div>
</div></form>

<script type="module" src="./page.mjs"></script>
</body></html>

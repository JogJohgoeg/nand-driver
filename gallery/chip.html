  <!-- 每颗芯片的短名和那一句说明构建时写在下面这张表里（prerender.mjs 填），这里不等任何文件就按地址里的编号填上标题和说明 -->
  <script id="headdata">var GALLERY_HEAD = {"279.732":["小车控制器","控制一辆小车在赛道上跑，是竞技场的第一位参赛者。","NAND 驱动 v1 · 小车控制器：21 个 NAND 门的小车控制器（DLGN 训练），NAND 驱动竞技场第 0 赛季 0 号参赛电路。"],"280.732":["带记忆的小车","能记住刚才发生了什么的小车控制器，跑得更快。","NAND 驱动 v2b · 带记忆：87 NAND + 3 LATCH 的变速赛道驱动；有记忆后跑完赛道 3,943 步，纯反应式要 8,826 步。"],"281.732":["鸭子转向大脑","替一只会走路的机器鸭子决定往哪边走。","Microduck 转向大脑：39 个 NAND 的转向大脑，接在 Microduck 双足行走模型上面决定往哪走。"],"282.732":["组合大脑 · 官网","给鸭子大脑加上记忆；21 NAND 官网也放在它这里。","组合大脑 Part B · 21nand 官网容器：22 NAND + 3 LATCH 的记忆覆盖电路（与 #281 组成组合大脑）；它的容器就是 21nand 官网所在的 282.732.tape。"],"285.732":["续写模型 第 1 版","一个小语言模型，每个字都在链上算出来；写出来多是词串，还不成句。","TapeoutLLM 一步模型 · 采样 v0.1：5,069 个 NAND 的一步语言模型，第一次把语言模型整颗流片上链；续写时每个字符由 BSC 节点 eth_call 真实执行；写出来多是词串，还不成句。"],"286.732":["续写模型 第 2 版","续写模型的第二版，演示页默认用它。","TapeoutLLM 一步模型 · 采样 v0.2：5,120 个 NAND 的第二版一步模型（采样器 v0.2），演示页默认用它。"],"287.732":["走格子策略","在格子地图上告诉你下一步往哪走，智能体拿它当工具。","nand_step · 11×11 走格子策略：386 个 NAND 的寻路策略：给出自己和目标的格子，输出下一步方向；14,641 种输入全部穷举验证。浏览器智能体把它当工具调用；NAND 玩 Squared 和入口页 02 的「链上跑一步」跑的也是它。"],"290.732":["只会上下的格子电路","想学会在格子里走到目标，实际只会往下或往上走；小游戏现在改用 287 号电路。","格子策略（蒸馏版）· 11×11：375 个 NAND：输入是 11×11 格子里自己和目标的位置（242 位），输出下一步往哪走（停、下、上、左、右）。实测它只会往下或往上走：全部 14,520 个局面里只走到目标 636 个（4.4%），比每步随便选还差。NAND 玩 Squared 现在改用 287。"],"3.2.245":["三值点积","一次把两串数对应相乘再加起来，给更大的电路当零件。","21nandkit DOT32_T · 三值点积：21nandkit 首个上链组件：320 位输入、32 位输出的三值点积，3,829 个 NAND，链上抽查 8 组全对。"],"900283.732":["智能体管家 第 2 版","帮智能体管对话轮次和工具调用，不让它乱来。","Agents-API 会话控制器 v2：264 NAND + 18 LATCH 的智能体会话状态机，管轮次、工具调用和子代理。"],"900284.732":["智能体管家 第 3 版","公开版智能体管家：出错重试、调用次数都有上限。","Agents-API 会话控制器 v3：325 NAND + 25 LATCH 的公开版会话控制器：轮次、重试、子代理、压缩次数都有熔断，16 条安全性质经 SAT 证明。"],"288.732":["身份验证器","放链上身份验证器网站的地方，类似手机上的两步验证码。","身份验证器 · 网站容器：1 个 NAND 的电路，用它的容器放链上身份验证器（Google Authenticator 复刻，备份用通行密钥加密后存链上）。"],"1.2.245":["TapeID 容器","X Layer 上的小车控制器；TapeID 网站和吟游诗人的版图存在这里。","21 NAND Driver · TapeID 容器：X Layer 上我们自建处理器 #245（TapeID）的 1 号电路：21 个 NAND 的驱动；容器放 TapeID 链上站，也存着吟游诗人的签核版图。"],"bard":["吟游诗人","写儿童故事风格句子的语言模型，句子常不连贯；直接做成了芯片版图。","吟游诗人 Bard · 整机版图 v8g：直接做成门级电路的小语言模型（tiny-stories 整数版 INT-C16）。SKY130A 整机布线，3.167 × 4.767 mm，整片签核 DRC 0、LVS 一致；研究版，未流片。签核版图存在 X Layer 1.2.245.tape 里。"],"bard-storybox":["故事机小板","给吟游诗人设计的故事机电路板，还没打样。","吟游诗人故事机 BardStoryBox · PCB：给吟游诗人做的 ESP32-S3 故事机小板：41 × 51 mm 双层，原理图与 PCB DRC 均为 0；未打板。"],"xc7a100t-miniboard":["验证小板","用来在芯片做出来之前先跑通电路的板子，还没打样。","XC7A100T 小板 · PCB：我们自己画的 Artix-7 FPGA 小板，用来把芯片先在 FPGA 上跑通：4 层、111 个器件，PCB DRC 0；未打板。"]};</script>

        <div class="tools"><output class="badge" id="zlevel" aria-label="缩放倍数" style="align-self:center">1×</output><button class="btn" id="zin" aria-label="放大">+</button><button class="btn" id="zout" aria-label="缩小">−</button><button class="btn" id="zfit" aria-pressed="true">全图</button></div>
      </div>
      <p class="dim" id="hint">拖动看别处，滚轮或双指缩放。点一个功能块，版图上会框出它用到的单元。</p>
    </section>
    <section class="pane" id="pane-fn" role="tabpanel" aria-labelledby="tab-fn" hidden>
      <ul class="subs" id="subs"><li class="dim">功能块读取中…</li></ul>
    </section>
  </div>
  <!-- 「核对」这一块的节点都先写在这里，脚本只原地换字：折叠说明点开了不会自己合上，按钮和进度字一直是同一个 -->
  <div class="check" id="check"><p id="checksay" style="display:grid"><span class="dim" style="grid-area:1/1">正在核对…</span></p>
    <p id="checkchain" style="display:grid"><span class="dim" style="grid-area:1/1">正在核对链上登记…</span></p>
    <details><summary>核对细节</summary>
      <p class="dim">每张瓦片、整片图和功能块数据都先下载字节、算 sha256，和这颗芯片的瓦片清单比；瓦片清单再和登记清单里的那一行比。一致了才显示。</p>
      <p><button class="btn" id="all" disabled>把瓦片都核一遍</button> <span id="allres" role="status" style="display:grid"><span class="dim" style="grid-area:1/1">读到这颗的瓦片清单之后才能核。</span></span></p>
    </details></div>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TapeID · 一键领取</title>
<meta name="description" content="把 IGNIX 金库分给你电路容器的交易税，一键结算、领取、转进钱包。">
<link rel="icon" href="./tapeid-default.png">
<style>
  /* 绿色版式（2026-10-01，全站统一；规范见 tapeout 仓库 circuits/_scratch/hashport/theme/README.md）。也是链上页面：只用系统字体、不连链外资源。 */
  :root {
    --bg:#F2F3EF; --card:#ffffff; --fg:#0B2A18; --dim:#3C5446; --line:rgba(0,107,53,.26);
    --acc:#006B35; --acc-fg:#F2F3EF; --acc-soft:#E2EEE5; --ok:#1E7A3C; --bad:#b3261e; --focus:#006B35;
    --r:0px; --gap:14px; --g:#006B35; --lime:#E4F53C; --done:rgba(0,107,53,.42);
    --disp:"Avenir Next Condensed","Bahnschrift","DIN Condensed","Roboto Condensed","Arial Narrow","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0D1A12; --card:#13241A; --fg:#E6EFE8; --dim:#A9BCB0; --line:rgba(91,224,143,.22);
      --acc:#5BE08F; --acc-fg:#0D1A12; --acc-soft:#1C3A28; --ok:#5CC57E; --bad:#ff8a80; --focus:#5BE08F; --g:#006A34; --done:rgba(91,224,143,.42); }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
  body::after { content:""; position:fixed; inset:0; border:5px solid #1E8C4E; pointer-events:none; z-index:1000; }
  @media (max-width:620px) { body::after { border-width:3px; } }
  main { max-width:720px; margin:0 auto; padding:0 16px 80px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-start; padding:18px 0 26px; margin-bottom:8px; background:var(--g); box-shadow:0 0 0 100vmax var(--g); clip-path:inset(0 -100vmax); color:#F2F3EF;
    --fg:#F2F3EF; --dim:rgba(242,243,239,.9); --line:rgba(242,243,239,.4); --acc:var(--lime); --acc-fg:#0B2A18; }
  header > div { flex:1 1 0; min-width:0; }
  .mark { flex-basis:100%; display:grid; line-height:.92; color:#F2F3EF; text-decoration:none; padding-bottom:16px; margin-bottom:6px; border-bottom:1px solid rgba(242,243,239,.28); }
  .mark b { font:200 21px/.92 var(--disp); font-stretch:condensed; text-transform:uppercase; letter-spacing:.02em; }
  .mark small { font:400 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.22em; text-transform:uppercase; color:rgba(242,243,239,.82); margin-top:5px; }
  header img { width:56px; height:56px; border-radius:50%; flex:none; }
  h1 { font:200 clamp(28px,5.4vw,40px)/1.1 var(--disp); font-stretch:condensed; margin:2px 0 8px; word-break:keep-all; overflow-wrap:anywhere; }
  .lead { color:var(--dim); margin:0; }
  #lang { margin-left:auto; flex:none; }
  ol.dots { list-style:none; display:flex; gap:6px; padding:0; margin:18px 0; }
  ol.dots li { flex:1; height:4px; border-radius:0; background:var(--line); }
  ol.dots li.done { background:var(--done); } ol.dots li.now { background:var(--acc); }
  section { background:var(--card); border:1px solid var(--line); border-top:4px solid var(--acc); border-radius:var(--r); padding:16px; margin-bottom:var(--gap); }
  section h2 { font:300 21px/1.2 var(--disp); font-stretch:condensed; margin:0 0 12px; display:flex; gap:10px; align-items:center; }
  section h2 .n { width:26px; height:26px; border-radius:0; background:var(--acc); color:var(--acc-fg); font:500 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; display:inline-grid; place-items:center; flex:none; }
  button, .btn { font:400 16px/1.2 var(--disp); font-stretch:condensed; letter-spacing:.05em; text-transform:uppercase; border-radius:0; border:1px solid var(--acc); background:var(--acc); color:var(--acc-fg); padding:10px 18px; cursor:pointer; text-decoration:none; display:inline-block; text-align:center; }
  button.big, .btn.big { width:100%; padding:14px; font-size:19px; font-weight:400; }
  button.ghost { background:transparent; color:var(--fg); border-color:var(--line); padding:6px 12px; }
  header button.ghost { font:500 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.06em; text-transform:none; background:#F2F3EF; color:#006B35; border-color:#F2F3EF; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  a { color:var(--acc); }
  .dim { color:var(--dim); } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; word-break:break-all; }
  .note { background:var(--acc-soft); border-left:3px solid var(--acc); border-radius:0; padding:10px 12px; margin-top:10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input, textarea { width:100%; font:inherit; padding:9px 11px; border:1px solid var(--line); border-radius:0; background:var(--bg); color:var(--fg); }
  textarea { min-height:90px; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  .hint { color:var(--dim); font-size:13px; margin:4px 0 0; }
  #circuits { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:8px; margin-top:10px; }
  @media (max-width:560px) { #circuits { grid-template-columns:1fr 1fr; } .circ .meta { font-size:12px; } }
  #pickerWrap.picked .circ:not(.on), #pickerWrap.picked #searchRow, #pickerWrap.picked #more { display:none !important; }
  #pickerWrap:not(.picked) #change { display:none; }
  .circ { font:inherit; font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; letter-spacing:0; text-transform:none; text-align:left; background:var(--bg); color:var(--fg); border:1px solid var(--line); padding:10px 12px; display:flex; flex-direction:column; gap:2px; }
  .circ.on { border-color:var(--acc); box-shadow:0 0 0 2px var(--acc) inset; }
  .circ .tid { font-weight:700; font-size:16px; } .circ .nm { color:var(--acc); font-weight:600; } .circ .meta { color:var(--dim); font-size:12.5px; }
  .preview { display:flex; gap:14px; align-items:center; }
  .preview img { width:84px; height:84px; border-radius:50%; flex:none; background:var(--bg); object-fit:cover; }
  .preview .pn { font:300 26px/1.1 var(--disp); font-stretch:condensed; } .preview .ps { color:var(--acc); font-weight:700; }
  ul.earn-list { margin:12px 0 0; padding-left:20px; }
  details { margin-top:14px; border-top:1px dashed var(--line); padding-top:10px; }
  summary::marker { color:var(--acc); }
  summary { cursor:pointer; color:var(--dim); }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:0; padding:10px; max-height:260px; overflow:auto; font-size:12px; white-space:pre-wrap; word-break:break-all; }
  .chk { display:flex; gap:10px; align-items:center; padding:6px 0; }
  .chk::before { content:"…"; width:22px; height:22px; border-radius:0; display:inline-grid; place-items:center; background:var(--line); color:var(--dim); font-size:13px; flex:none; }
  .chk.ok::before { content:"✓"; background:var(--ok); color:#fff; }
  .chk.bad::before { content:"!"; background:var(--bad); color:#fff; }
  .chk.bad span { color:var(--bad); }
  .earn { display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; padding:10px 0; border-top:1px dashed var(--line); }
  .earn .amt { font-weight:700; }
  .coinrow { width:100%; font:inherit; font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; letter-spacing:0; text-transform:none; text-align:left; background:transparent; color:var(--fg); border:0; border-top:1px dashed var(--line); border-radius:0; padding:10px 0; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translate(-50%, 40px); opacity:0; transition:.2s; background:var(--fg); color:var(--bg);
    padding:10px 16px; border-radius:0; max-width:calc(100% - 32px); pointer-events:none; }
  .toast.show { transform:translate(-50%, 0); opacity:1; } .toast.bad { background:var(--bad); color:#fff; } .toast.ok { background:var(--ok); color:#fff; }
  footer { color:var(--dim); font-size:12.5px; text-align:center; margin-top:24px; }
  [hidden] { display:none !important; }
  .row .head { font:300 21px/1.2 var(--disp); font-stretch:condensed; margin-bottom:6px; }
  .row table { width:100%; border-collapse:collapse; margin:4px 0 10px; } .row td { padding:4px 4px; border-bottom:1px dashed var(--line); }
  ol.steps { margin:8px 0 10px; padding-left:20px; color:var(--dim); } ol.steps li.ok { color:var(--ok); }
</style>
</head>
<body>
<main>
  <header>
    <a class="mark" href="https://nand.aihashrate.stream/" aria-label="21 NAND Driver"><b>21 NAND<br>Driver</b><small>TapeOut · BNB Chain · X Layer</small></a>
    <img src="./21-nand-driver.png" alt="">
    <div><h1 data-i="title"></h1><p class="lead" data-i="lead"></p></div>
    <button id="lang" class="ghost" type="button" data-i="lang"></button>
  </header>
  <section>
    <button id="connect" class="big" type="button" data-i="connect"></button>
    <p id="connected" class="mono" hidden></p>
    <div id="noWallet" class="note" hidden><p data-i="noWallet" style="margin:0"></p></div>
  </section>
  <p id="state" class="dim" hidden></p>
  <div id="none" class="note" hidden><p data-i="none" style="margin:0 0 8px"></p><a class="btn" href="./xlayer.html">TapeID · X Layer</a></div>
  <div id="rows"></div>
  <p class="hint" id="feeNote"></p>
  <p class="hint" id="safeNote"></p>
  <p><button id="refresh" class="ghost" type="button" data-i="refresh"></button></p>
  <footer>TapeID · X Layer · <a href="./xlayer.html">发币 / Launch</a> · 本页不含自有合约，每笔交易都由你的钱包签名 / no custom contracts, every transaction is signed by your wallet</footer>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="./claim.bundle.js?v=d5cffdd88d"></script>
</body>
</html>

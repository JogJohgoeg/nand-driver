<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050506">
<title>TapeID · 一键领取</title>
<meta name="description" content="把 IGNIX 金库分给你电路容器的交易税，一键结算、领取、转进钱包。">
<link rel="icon" href="./tapeid-default.png">
<style>
  /* Kraken Pro 式深色（2026-10-14，与新官网 site/home.css 同一套配色）。也是链上页面：只用系统字体、不连链外资源。 */
  :root {
    color-scheme:dark;
    --bg:#050506; --card:#111114; --card-2:#17171C; --fg:#FFFFFF; --text-2:#CBCBD3; --dim:#9C9DAE;
    --line:rgba(112,113,135,.24); --line-soft:rgba(112,113,135,.14);
    --brand:#5741D8; --brand-hover:#6A55E8; --acc:#A496FF; --acc-fg:#FFFFFF; --acc-soft:rgba(87,65,216,.16);
    --ok:#00DA80; --bad:#F0616D; --focus:#A496FF;
    --r:16px; --gap:14px; --done:rgba(164,150,255,.42);
    --sans:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(70% 90% at 25% 0%, rgba(87,65,216,.28), rgba(87,65,216,0) 70%) top / 100% 520px no-repeat, var(--bg); color:var(--fg); font:15px/1.6 var(--sans); }
  main { max-width:720px; margin:0 auto; padding:0 16px 80px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-start; padding:18px 0 26px; margin-bottom:8px; border-bottom:1px solid var(--line-soft); color:var(--fg); }
  header > div { flex:1 1 0; min-width:0; }
  .mark { flex-basis:100%; display:grid; line-height:1.1; color:var(--fg); text-decoration:none; padding-bottom:16px; margin-bottom:6px; border-bottom:1px solid var(--line-soft); }
  .mark b { font:800 20px/1.1 var(--sans); letter-spacing:.01em; }
  .mark small { font:400 11px/1 var(--mono); letter-spacing:.04em; color:var(--dim); margin-top:6px; }
  header img { width:56px; height:56px; border-radius:50%; flex:none; }
  h1 { font:800 clamp(28px,5.4vw,40px)/1.15 var(--sans); letter-spacing:-.01em; margin:2px 0 8px; word-break:keep-all; overflow-wrap:anywhere; }
  .lead { color:var(--text-2); margin:0; }
  #lang { margin-left:auto; flex:none; }
  ol.dots { list-style:none; display:flex; gap:6px; padding:0; margin:18px 0; }
  ol.dots li { flex:1; height:4px; border-radius:2px; background:var(--line); }
  ol.dots li.done { background:var(--done); } ol.dots li.now { background:var(--acc); }
  section { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px; margin-bottom:var(--gap); }
  section h2 { font:700 19px/1.3 var(--sans); margin:0 0 12px; display:flex; gap:10px; align-items:center; }
  section h2 .n { width:26px; height:26px; border-radius:8px; background:var(--brand); color:#fff; font:600 13px/1 var(--mono); display:inline-grid; place-items:center; flex:none; }
  button, .btn { font:600 16px/1.2 var(--sans); border-radius:12px; border:1px solid var(--brand); background:var(--brand); color:#fff; padding:10px 18px; cursor:pointer; text-decoration:none; display:inline-block; text-align:center; }
  button:not(.ghost):not(.circ):not(.coinrow):not(:disabled):hover, .btn:hover { background:var(--brand-hover); border-color:var(--brand-hover); color:#fff; }
  button.big, .btn.big { width:100%; padding:14px; font-size:18px; font-weight:600; }
  button.ghost { background:transparent; color:var(--fg); border-color:var(--line); padding:6px 12px; font-weight:500; }
  button.ghost:not(:disabled):hover { border-color:var(--acc); color:var(--acc); }
  header button.ghost { font:500 12px/1.4 var(--mono); background:var(--card-2); color:var(--text-2); border-color:var(--line); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  a { color:var(--acc); }
  .dim { color:var(--dim); } .mono { font-family:var(--mono); font-size:13px; word-break:break-all; }
  .note { background:var(--acc-soft); border:1px solid var(--line-soft); border-left:3px solid var(--brand); border-radius:10px; padding:10px 12px; margin-top:10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input, textarea { width:100%; font:inherit; padding:9px 11px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); }
  textarea { min-height:90px; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  .hint { color:var(--dim); font-size:13px; margin:4px 0 0; }
  #circuits { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:8px; margin-top:10px; }
  @media (max-width:560px) { #circuits { grid-template-columns:1fr 1fr; } .circ .meta { font-size:12px; } }
  #pickerWrap.picked .circ:not(.on), #pickerWrap.picked #searchRow, #pickerWrap.picked #more { display:none !important; }
  #pickerWrap:not(.picked) #change { display:none; }
  .circ { font:inherit; font-family:var(--sans); letter-spacing:0; text-transform:none; text-align:left; background:var(--card-2); color:var(--fg); border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; gap:2px; }
  .circ:hover { border-color:rgba(164,150,255,.5); }
  .circ.on { border-color:var(--acc); box-shadow:0 0 0 2px var(--acc) inset; }
  .circ .tid { font-weight:700; font-size:16px; } .circ .nm { color:var(--acc); font-weight:600; } .circ .meta { color:var(--dim); font-size:12.5px; }
  .preview { display:flex; gap:14px; align-items:center; }
  .preview img { width:84px; height:84px; border-radius:50%; flex:none; background:var(--card-2); object-fit:cover; }
  .preview .pn { font:700 26px/1.15 var(--sans); } .preview .ps { color:var(--acc); font-weight:700; }
  ul.earn-list { margin:12px 0 0; padding-left:20px; }
  details { margin-top:14px; border-top:1px dashed var(--line); padding-top:10px; }
  summary::marker { color:var(--acc); }
  summary { cursor:pointer; color:var(--dim); }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; max-height:260px; overflow:auto; font-size:12px; white-space:pre-wrap; word-break:break-all; }
  .chk { display:flex; gap:10px; align-items:center; padding:6px 0; }
  .chk::before { content:"…"; width:22px; height:22px; border-radius:50%; display:inline-grid; place-items:center; background:var(--card-2); border:1px solid var(--line); color:var(--dim); font-size:13px; flex:none; }
  .chk.ok::before { content:"✓"; background:var(--ok); border-color:var(--ok); color:#050506; }
  .chk.bad::before { content:"!"; background:var(--bad); border-color:var(--bad); color:#050506; }
  .chk.bad span { color:var(--bad); }
  .earn { display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; padding:10px 0; border-top:1px dashed var(--line); }
  .earn .amt { font-weight:700; }
  .coinrow { width:100%; font:inherit; font-family:var(--sans); letter-spacing:0; text-transform:none; text-align:left; background:transparent; color:var(--fg); border:0; border-top:1px dashed var(--line); border-radius:0; padding:10px 0; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translate(-50%, 40px); opacity:0; transition:.2s; background:var(--card-2); color:var(--fg); border:1px solid var(--line); box-shadow:0 8px 24px rgba(0,0,0,.5);
    padding:10px 16px; border-radius:12px; max-width:calc(100% - 32px); pointer-events:none; }
  .toast.show { transform:translate(-50%, 0); opacity:1; } .toast.bad { background:var(--bad); border-color:var(--bad); color:#050506; } .toast.ok { background:var(--ok); border-color:var(--ok); color:#050506; }
  footer { color:var(--dim); font-size:12.5px; text-align:center; margin-top:24px; }
  .row .head { font:700 19px/1.3 var(--sans); margin-bottom:6px; }
  .row table { width:100%; border-collapse:collapse; margin:4px 0 10px; } .row td { padding:4px 4px; border-bottom:1px dashed var(--line); }
  ol.steps { margin:8px 0 10px; padding-left:20px; color:var(--dim); } ol.steps li.ok { color:var(--ok); }
  [hidden] { display:none !important; }
</style>
<!--tk-shell--><script src="../shell/lang.js"></script><link rel="stylesheet" href="../shell/shell.css"><script src="../shell/shell.js" defer></script><!--/tk-shell-->
</head>
<body>
<main>
  <header>
    <a class="mark" href="https://nand.aihashrate.stream/" aria-label="21 NAND Driver"><b>21 NAND<br>Driver</b><small>TapeOut · BNB Chain · X Layer</small></a>
    <img src="./21-nand-driver.png" alt="">
    <div><h1 data-i="title"></h1><p class="lead" data-i="lead"></p></div>
    <button id="lang" class="ghost" type="button" data-i="lang"></button>
  </header>
  <section>
    <button id="connect" class="big" type="button" data-i="connect"></button>
    <p id="connected" class="mono" hidden></p>
    <div id="noWallet" class="note" hidden><p data-i="noWallet" style="margin:0"></p></div>
  </section>
  <p id="state" class="dim" hidden></p>
  <div id="none" class="note" hidden><p data-i="none" style="margin:0 0 8px"></p><a class="btn" href="./xlayer.html">TapeID · X Layer</a></div>
  <div id="rows"></div>
  <p class="hint" id="feeNote"></p>
  <p class="hint" id="safeNote"></p>
  <p><button id="refresh" class="ghost" type="button" data-i="refresh"></button></p>
  <footer>TapeID · X Layer · <a href="./xlayer.html">发币 / Launch</a> · 本页不含自有合约，每笔交易都由你的钱包签名 / no custom contracts, every transaction is signed by your wallet</footer>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="./claim.bundle.js?v=d5cffdd88d"></script>
</body>
</html>

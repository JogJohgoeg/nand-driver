  ops:'<tr><td>Einops</td><td style="text-align:left">签名分组全收缩，乘积求和后 round + saturate 到 (W,F)</td></tr><tr><td>Linear</td><td style="text-align:left">权重布局 in_shape+out_shape，同 torch Multilinear</td></tr><tr><td>Embedding</td><td style="text-align:left">每个输出维一张查找表</td></tr><tr><td>SoftMax @ wtril</td><td style="text-align:left">融合成因果 softmax：先掩码再归一，指数查表 EF=8 位</td></tr><tr><td>Normalize</td><td style="text-align:left">LayerNorm（torch 后端的映射）：c=n·x−Σx 精确，isqrt 内多 4 位</td></tr><tr><td>AdditionOp / Elementwise</td><td style="text-align:left">对齐小数位相加 / ReLU</td></tr>',
  fmt:'格式：激活 W=10 位、F=4 位小数；权重 4 位、3 位小数；attention core 例外（2 位整数 q/k/v）。',
  sum_h:'五张图的验证结果', sc1:'图', sc2:'输入位', sc4:'深度', sc5:'对定点参考', sc6:'vs torch 平均误差', sc7:'最大误差', sc8:'最大误差来源',
  foot:'2026-09-17 · ncd2net · 浏览器内网表求值只用 pairs/taps 两个数组：wire[i] = NAND(wire[a], wire[b])，输入是前 nIn 根线。',
  meta:{
   core:{title:'Attention core', hint:'q/k/v 各 2×1×2，取值 0..3', why:'torch 版 wtril 分母 +1e-8：行 0 分数 (0,18) 时浮点给 0.6·v₀，网表给数学上正确的 1.0·v₀'},
   block:{title:'Attention block', hint:'X 为 2 个 token × m=2，取值 [-1, 0.875]', why:'定点 softmax/线性层的舍入累计'},
   ffn:{title:'Add(FFN)', hint:'x 为 m=2 维，取值 [-1, 0.875]', why:'舍入'},
   layer:{title:'Transformer 层', hint:'X 为 2 个 token × m=2', why:'2 元素 LayerNorm 在 1 LSB 平局处的符号翻转'},
   transformer:{title:'AlgebraicTransformer', hint:'2 个 token id，取值 0..3；输出每 token 的 softmax(4)', why:'16 种输入被 abc 折成查表；误差来自 softmax 量化'},
  }},
 en:{
  h1:'string-diagram netlist bench',
  sub:'pyncd string diagrams (Vincent Abbott\'s Weaves / Wires / Morphisms) → fixed-point IR → Verilog → yosys/abc → 2-input NAND netlists. Every netlist below is evaluated gate by gate in your browser.',
  q1:'What is it', a1:'<b>A generic compiler</b>: any pyncd diagram with configured sizes (Composed / Product / Rearrangement / Block / Broadcasted) is unrolled over its degree axes into a scalar integer IR; interval tracking sets every wire width; yosys/abc maps it to NAND.',
  q2:'Does it work', a2:'<b>All 5 diagrams pass</b>: each netlist matches its fixed-point reference exhaustively (2^24 / 2^16 / 2^8 / 2^4 inputs, zero mismatches) and differs from pyncd\'s own torch compilation (same integer weights) by a mean of ≤ 0.024 (LSB = 1/16).',
  q3:'How to use', a3:'<code>python demo_ncd2net.py core block ffn layer transformer</code> → <code>out/&lt;name&gt;.json</code> (netlist + weights + verification) and <code>.v</code>. Code in <code>circuits/_scratch/pyncd_net/ncd2net/</code>, bd tp-4awp.',
  inputs:'Inputs', run:'Run netlist', rand:'Random inputs', sweep:'Compare 2000 random samples', outputs:'Outputs: netlist vs float model',
  c_el:'element', c_net:'netlist (fixed)', c_float:'float', c_err:'|error|', s_w:'Weights (integers; divide by 2^WF for the float value)', s_bits:'Netlist output bits (y, LSB first)', nop:'(no learnable weights)',
  st_nand:'NAND', st_depth:'depth', st_in:'inputs', st_out:'outputs', st_bits:'bits', st_ref:'vs fixed-point reference', st_ok:'zero mismatches', st_bad:'mismatches', st_torch:'vs torch mean', st_max:'max', st_n:'samples',
  live1:(g,ms,mx,lsb)=>`${g} NAND gates evaluated in <b>${ms} ms</b> · max |error| this run <b>${mx}</b> (LSB ${lsb})`,
  live2:(N,k,mean,mx,ms)=>`${N} random inputs × ${k} outputs, compared live against the float model: mean |error| <b>${mean}</b>, max <b>${mx}</b>, <b>${ms} ms</b>`,
  pipe_h:'Pipeline',
  pipe:'<li><b>Walk the pyncd term</b>: Composed in sequence, ProductOfMorphisms split by dom, Rearrangement copies/permutes, Block unrolled by repetition (fresh weights per repetition).</li><li><b>Unroll each Broadcasted</b>: for every index combination of the degree axes, gather each input\'s target sub-array through the reindexing mapping, apply the operator\'s fixed-point semantics, write the result into the output weave\'s TILED slots. A tensor at compile time is (array of nodes, fractional bits).</li><li><b>Scalar IR</b>: input / const / add / sub / mul / max / min / shr / shl / relu / clip / lut / div / isqrt; every node carries an interval [lo, hi] and its Verilog wire is exactly that wide, so nothing can overflow.</li><li><b>yosys/abc</b> <code>abc -g NAND</code>; constant output bits get ONE=NAND(x₀,¬x₀) gates; outputs are moved to the last nOut gates (chain format).</li><li><b>Verification</b>: exhaustive for ≤ 24 input bits (bit-packed truth tables), else 100k random vectors; then compared with the torch compilation.</li>',
  ops_h:'Fixed-point semantics per operator', ops_c1:'pyncd operator', ops_c2:'implementation',
  ops:'<tr><td>Einops</td><td style="text-align:left">full contraction over the signature groups; sum of products, then round + saturate to (W,F)</td></tr><tr><td>Linear</td><td style="text-align:left">weights laid out in_shape+out_shape, as torch Multilinear</td></tr><tr><td>Embedding</td><td style="text-align:left">one lookup table per output dimension</td></tr><tr><td>SoftMax @ wtril</td><td style="text-align:left">fused into a causal softmax: mask first, then normalise; exp LUT with EF=8 bits</td></tr><tr><td>Normalize</td><td style="text-align:left">LayerNorm (the torch backend\'s mapping): c=n·x−Σx exactly, 4 extra bits inside isqrt</td></tr><tr><td>AdditionOp / Elementwise</td><td style="text-align:left">add with aligned fractions / ReLU</td></tr>',
  fmt:'Format: activations W=10 bits with F=4 fractional; weights 4 bits with 3 fractional; the attention core is the exception (2-bit integer q/k/v).',
  sum_h:'Verification of the five diagrams', sc1:'diagram', sc2:'input bits', sc4:'depth', sc5:'vs fixed-point reference', sc6:'vs torch mean error', sc7:'max error', sc8:'where the max error comes from',
  foot:'2026-09-17 · ncd2net · In-browser evaluation uses only the pairs/taps arrays: wire[i] = NAND(wire[a], wire[b]); the first nIn wires are the inputs.',
  meta:{
   core:{title:'Attention core', hint:'q/k/v each 2×1×2, values 0..3', why:'the torch wtril adds 1e-8 to its denominator: for row-0 scores (0,18) the float model gives 0.6·v₀, the netlist gives the mathematically correct 1.0·v₀'},
   block:{title:'Attention block', hint:'X is 2 tokens × m=2, values in [-1, 0.875]', why:'accumulated rounding in the fixed-point softmax and linear layers'},
   ffn:{title:'Add(FFN)', hint:'x has m=2 dims, values in [-1, 0.875]', why:'rounding'},
   layer:{title:'Transformer layer', hint:'X is 2 tokens × m=2', why:'the 2-element LayerNorm flips sign at a one-LSB tie'},
   transformer:{title:'AlgebraicTransformer', hint:'2 token ids, values 0..3; output is softmax(4) per token', why:'16 possible inputs, folded into a lookup by abc; error comes from softmax quantisation'},
  }},
};
let LANG='zh'; try{ const l=localStorage.getItem('ncd2net.lang'); if(l==='en'||l==='zh') LANG=l; }catch(e){}
const T=k=>I18N[LANG][k];
const META=new Proxy({}, {get:(_,k)=>I18N[LANG].meta[k]});
function applyLang(){ document.documentElement.lang = LANG==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=T(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{ el.innerHTML=T(el.dataset.i18nHtml); });
  document.getElementById('lang').textContent = LANG==='zh'?'EN':'中文'; }

// ── netlist evaluation ────────────────────────────────────────────────
function evalNet(net, bits){ // bits: array of 0/1 length nIn (LSB-first fields)
  const w = new Uint8Array(net.nIn + net.pairs.length);
  for(let i=0;i<net.nIn;i++) w[i]=bits[i];
  const P=net.pairs; let k=net.nIn;
  for(let i=0;i<P.length;i++,k++) w[k] = 1 ^ (w[P[i][0]] & w[P[i][1]]);
  return net.taps.map(t=>w[t]);
}
const prod = s => s.reduce((a,b)=>a*b,1);
function encodeInputs(net, values){ // values[i] = flat array of element values (already quantised ints)
  const bits = new Array(net.nIn).fill(0); let pos=0;
  net.inputs.forEach((inp,i)=>{ const [,shape,b] = inp; const n=prod(shape);
    for(let k=0;k<n;k++){ let v = values[i][k]; if(v<0) v += (1<<b); for(let j=0;j<b;j++) bits[pos++] = (v>>j)&1; } });
  return bits;
}
function decodeOutputs(net, ybits){ const W=net.format.W, F=net.format.F, out=[]; let pos=0;
  net.outputs.forEach(shape=>{ const n=prod(shape); const arr=[];
    for(let k=0;k<n;k++){ let v=0; for(let j=0;j<W;j++) v |= ybits[pos++]<<j; if(v>=(1<<(W-1))) v-=(1<<W); arr.push(v/(1<<F)); }
    out.push(arr); });
  return out;
}
// ── float reference (same math as pyncd's torch compile) ───────────────
const flat = a => Array.isArray(a) ? a.flatMap(flat) : [a];
function W(net,name,wf){ return flat(net.params[name]).map(v=>v/(1<<wf)); }
function causalSoftmax(row, upto){ const m=Math.max(...row.slice(0,upto+1)); const e=row.map((v,j)=>j<=upto?Math.exp(v-m):0); const s=e.reduce((a,b)=>a+b,0); return e.map(v=>v/s); }
function core(q,k,v,Q,X,D){ // q,k,v flat [tok][h=1][d]; returns flat [q][h][d]
  const out=[]; for(let i=0;i<Q;i++){ const s=[]; for(let x=0;x<X;x++){ let a=0; for(let d=0;d<D;d++) a+=q[i*D+d]*k[x*D+d]; s.push(a);} const w=causalSoftmax(s,i);
    for(let d=0;d<D;d++){ let a=0; for(let x=0;x<X;x++) a+=w[x]*v[x*D+d]; out.push(a);} } return out; }
function linear(x,w,nin,nout){ const o=new Array(nout).fill(0); for(let i=0;i<nin;i++) for(let j=0;j<nout;j++) o[j]+=x[i]*w[i*nout+j]; return o; }
function attnBlock(net,X,T,M,HD,base){ const wf=net.format.WF; const [Wq,Wk,Wv,Wo]=[0,1,2,3].map(i=>W(net,`Linear${base+i}.weight`,wf));
  const q=[],k=[],v=[]; for(let t=0;t<T;t++){ const x=X.slice(t*M,t*M+M); q.push(...linear(x,Wq,M,HD)); k.push(...linear(x,Wk,M,HD)); v.push(...linear(x,Wv,M,HD)); }
  const o=core(q,k,v,T,T,HD); const out=[]; for(let t=0;t<T;t++) out.push(...linear(o.slice(t*HD,t*HD+HD),Wo,HD,M)); return out; }
function ffnF(net,x,M,DF,base){ const wf=net.format.WF; const h=linear(x,W(net,`Linear${base}.weight`,wf),M,DF).map(v=>Math.max(0,v)); return linear(h,W(net,`Linear${base+1}.weight`,wf),DF,M); }
function layerNorm(x){ const n=x.length, mu=x.reduce((a,b)=>a+b,0)/n; const c=x.map(v=>v-mu); const varr=c.reduce((a,b)=>a+b*b,0)/n; return c.map(v=>v/Math.sqrt(varr+1e-5)); }
function layerF(net,X,T,M,HD,DF,base){ const a=attnBlock(net,X,T,M,HD,base); let h=[]; for(let t=0;t<T;t++) h.push(...layerNorm(X.slice(t*M,t*M+M).map((v,i)=>v+a[t*M+i])));
  const out=[]; for(let t=0;t<T;t++){ const x=h.slice(t*M,t*M+M); const f=ffnF(net,x,M,DF,base+4); out.push(...layerNorm(x.map((v,i)=>v+f[i]))); } return out; }
const REF = {
  core:(net,vals)=>[core(vals[0],vals[1],vals[2],2,2,2)],
  block:(net,vals)=>[attnBlock(net,vals[0],2,2,2,0)],
  ffn:(net,vals)=>{ const x=vals[0]; const f=ffnF(net,x,2,3,0); return [x.map((v,i)=>v+f[i])]; },
  layer:(net,vals)=>[layerF(net,vals[0],2,2,2,3,0)],
  transformer:(net,vals)=>{ const E=flat(net.params['Embedding0.weight']).map(v=>v/(1<<net.format.F)); const M=2,T=2,V=4;
    const X=[]; for(let t=0;t<T;t++) X.push(...E.slice(vals[0][t]*M, vals[0][t]*M+M));
    const h=layerF(net,X,T,M,2,3,0); const Wl=W(net,'Linear6.weight',net.format.WF); const out=[];
    for(let t=0;t<T;t++){ const z=linear(h.slice(t*M,t*M+M),Wl,M,V); out.push(...causalSoftmax(z,V-1)); } return [out]; },
};
// ── input model ─────────────────────────────────────────────────────────
function fieldSpec(net,inp){ const [name,shape,b,signed]=inp; const natural = net.natural && net.natural.includes(name) || (!signed && net.format.IN_F===null);
  const inF = (name.startsWith('in') && net.format.IN_F!==null && net.format.IN_F!==undefined) ? net.format.IN_F : net.format.F;
  const isTok = (name==='in0' && ORDER_CUR==='transformer');
  if(isTok) return {shape,b,signed:false,scale:1,min:0,max:(1<<b)-1,step:1};
  const scale = 1<<inF; const min = signed? -(1<<(b-1))/scale : 0, max = signed? ((1<<(b-1))-1)/scale : ((1<<b)-1)/scale; return {shape,b,signed,scale,min,max,step:1/scale}; }
let ORDER_CUR='core';
function idxLabel(shape,k){ const idx=[]; let r=k; for(let i=shape.length-1;i>=0;i--){ idx.unshift(r%shape[i]); r=Math.floor(r/shape[i]); } return idx.join(','); }
function buildInputs(net){ const box=document.getElementById('inputs'); box.innerHTML='';
  net.inputs.forEach((inp,i)=>{ const spec=fieldSpec(net,inp); const n=prod(spec.shape); const g=document.createElement('div'); g.className='grid';
    g.style.gridTemplateColumns = `auto repeat(${Math.min(n, 4)}, auto)`;
    const names = {core:['q','k','v']}[ORDER_CUR] || ['x'];
    for(let k=0;k<n;k++){ if(k%4===0){ const l=document.createElement('div'); l.className='lab'; l.textContent = k===0 ? `${names[i]||inp[0]}[${spec.shape.join('×')}]` : ''; g.appendChild(l);}
      const e=document.createElement('input'); e.type='number'; e.id=`in_${ORDER_CUR}_${i}_${k}`; e.min=spec.min; e.max=spec.max; e.step=spec.step; e.title=`[${idxLabel(spec.shape,k)}]`; e.value=0; g.appendChild(e);
      if((k+1)%4===0 && k+1<n){} }
    box.appendChild(g); });
  const hint=document.createElement('div'); hint.className='live'; hint.textContent=META[ORDER_CUR].hint; box.appendChild(hint); }
function readInputs(net){ return net.inputs.map((inp,i)=>{ const spec=fieldSpec(net,inp); const n=prod(spec.shape); const ints=[], floats=[];
  for(let k=0;k<n;k++){ const e=document.getElementById(`in_${ORDER_CUR}_${i}_${k}`); let v=parseFloat(e.value)||0; v=Math.min(spec.max,Math.max(spec.min,v)); let q=Math.round(v*spec.scale); e.value=q/spec.scale; ints.push(q); floats.push(q/spec.scale);} return {ints,floats}; }); }
function randomInputs(net){ net.inputs.forEach((inp,i)=>{ const spec=fieldSpec(net,inp); const n=prod(spec.shape); for(let k=0;k<n;k++){ const steps=Math.round((spec.max-spec.min)/spec.step); document.getElementById(`in_${ORDER_CUR}_${i}_${k}`).value = spec.min + spec.step*Math.floor(Math.random()*(steps+1)); } }); }
function randomInts(net){ return net.inputs.map(inp=>{ const spec=fieldSpec(net,inp); const n=prod(spec.shape); const ints=[],floats=[]; for(let k=0;k<n;k++){ const steps=Math.round((spec.max-spec.min)/spec.step); const q=Math.round(spec.min*spec.scale)+Math.floor(Math.random()*(steps+1)); ints.push(q); floats.push(q/spec.scale);} return {ints,floats}; }); }
// ── run ────────────────────────────────────────────────────────────────
function runOnce(net, vals){ const t0=performance.now(); const y=evalNet(net, encodeInputs(net, vals.map(v=>v.ints))); const ms=performance.now()-t0;
  const outs=decodeOutputs(net,y); const ref=REF[ORDER_CUR](net, vals.map(v=>v.floats)); return {y,outs,ref,ms}; }
function run(){ const net=NETS[ORDER_CUR]; const vals=readInputs(net); const r=runOnce(net,vals);
  const tb=document.querySelector('#out tbody'); tb.innerHTML=''; let maxe=0;
  net.outputs.forEach((shape,oi)=>{ r.outs[oi].forEach((v,k)=>{ const f=r.ref[oi][k]; const e=Math.abs(v-f); maxe=Math.max(maxe,e); const tr=document.createElement('tr');
    tr.innerHTML=`<td>y[${idxLabel(shape,k)}]</td><td class="num">${v.toFixed(4)}</td><td class="num">${f.toFixed(4)}</td><td class="num">${e.toFixed(4)}</td>`; tb.appendChild(tr); }); });
  document.getElementById('bits').textContent = r.y.join('');
  document.getElementById('live').innerHTML = T('live1')(net.pairs.length, r.ms.toFixed(2), maxe.toFixed(4), 1/(1<<net.format.F)); }
function sweep(){ const net=NETS[ORDER_CUR]; const N=2000; let sum=0,cnt=0,mx=0; const t0=performance.now();
  for(let s=0;s<N;s++){ const vals=randomInts(net); const r=runOnce(net,vals); net.outputs.forEach((shape,oi)=>r.outs[oi].forEach((v,k)=>{ const e=Math.abs(v-r.ref[oi][k]); sum+=e; cnt++; mx=Math.max(mx,e); })); }
  document.getElementById('live').innerHTML = T('live2')(N, cnt/N, (sum/cnt).toFixed(4), mx.toFixed(4), (performance.now()-t0).toFixed(0)); }
// ── page ───────────────────────────────────────────────────────────────
function select(name){ ORDER_CUR=name; const net=NETS[name];
  document.querySelectorAll('#navlist li').forEach(li=>li.setAttribute('aria-selected', li.dataset.name===name));
  document.getElementById('formula').textContent = net.diagram;
  const v=net.verify, t=net.torch||{};
  document.getElementById('stats').innerHTML = `<span>${T('st_nand')} <b>${net.g}</b></span><span>${T('st_depth')} <b>${net.d}</b></span><span>${T('st_in')} <b>${net.nIn}</b> ${T('st_bits')}</span><span>${T('st_out')} <b>${net.nOut}</b> ${T('st_bits')}</span>`+
    `<span>${T('st_ref')} <span class="pill ${v.ok?'ok':'bad'}">${v.mode} ${v.ok?T('st_ok'):T('st_bad')}</span></span>`+
    (t.mean_abs_err!==undefined?`<span>${T('st_torch')} <b>${t.mean_abs_err.toFixed(4)}</b> ${T('st_max')} <b>${t.max_abs_err.toFixed(3)}</b> (${t.n} ${T('st_n')})</span>`:'');
  document.getElementById('weights').textContent = Object.keys(net.params).length ? Object.entries(net.params).map(([k,v])=>`${k} = ${JSON.stringify(v)}`).join('\n') : T('nop');
  buildInputs(net); randomInputs(net); run(); try{localStorage.setItem('ncd2net.tab',name);}catch(e){} }
function buildNav(){ const nl=document.getElementById('navlist'); nl.innerHTML='';
  ORDER.forEach(name=>{ const net=NETS[name]; const li=document.createElement('li'); li.dataset.name=name; li.setAttribute('role','tab'); li.tabIndex=0; li.setAttribute('aria-selected', name===ORDER_CUR);
    li.innerHTML=`<span class="n">${META[name].title}</span><span class="g">${net.g} NAND</span><span class="f">${net.diagram.split(';')[0]}</span>`;
    li.addEventListener('click',()=>select(name)); li.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();select(name);} }); nl.appendChild(li); }); }
function buildSummary(){ const sb=document.querySelector('#summary tbody'); sb.innerHTML='';
  ORDER.forEach(name=>{ const net=NETS[name], v=net.verify, t=net.torch||{}; const tr=document.createElement('tr');
    tr.innerHTML=`<td>${META[name].title}</td><td class="num">${net.nIn}</td><td class="num">${net.g}</td><td class="num">${net.d}</td><td><span class="pill ${v.ok?'ok':'bad'}">${v.mode} ${v.ok?T('st_ok'):T('st_bad')}</span></td><td class="num">${t.mean_abs_err!==undefined?t.mean_abs_err.toFixed(4):'—'}</td><td class="num">${t.max_abs_err!==undefined?t.max_abs_err.toFixed(2):'—'}</td><td style="text-align:left">${META[name].why}</td>`; sb.appendChild(tr); }); }
function render(){ applyLang(); buildNav(); buildSummary(); select(ORDER_CUR); }
document.getElementById('lang').addEventListener('click',()=>{ LANG = LANG==='zh'?'en':'zh'; try{localStorage.setItem('ncd2net.lang',LANG);}catch(e){} render(); });
document.getElementById('run').addEventListener('click',run);
document.getElementById('rand').addEventListener('click',()=>{randomInputs(NETS[ORDER_CUR]);run();});
document.getElementById('sweep').addEventListener('click',sweep);
try{ const s=localStorage.getItem('ncd2net.tab'); if(s&&NETS[s]) ORDER_CUR=s; }catch(e){}
render();
</script>
